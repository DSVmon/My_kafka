stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Сборка Docker-образа..."
    - docker build -t kafka-demo-app:$CI_COMMIT_SHORT_SHA .
  only:
    - master

test:
  stage: test
  image: python:3.11.9
  script:
    - pip install --no-cache-dir -r requirements.txt
    - python app/main.py
  only:
    - master

deploy:
  stage: deploy
  image: docker:latest
  script:
    - echo "Деплой в тестовую/продакшн среду..."
  only:
    - master